name: Sync recipe data

on:
  push:
    paths:
      - 'recipes.json'
      - 'sync_recipe_data.py'
      - 'aggregate_shopping.py'
      - 'patch_recipe_checks.py'
      - '.github/workflows/sync-recipes.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild meal plan from recipe data
        run: |
          python sync_recipe_data.py
          python aggregate_shopping.py
          python patch_recipe_checks.py
      - name: Commit generated page
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet; then
            exit 0
          fi
          git add index.html
          git commit -m 'Sync recipe data'
          git push

# recipe check UI refresh: icon only

name: Adjust meal plan layout

on:
  push:
    paths:
      - '.github/workflows/rename-title.yml'

permissions:
  contents: write

jobs:
  adjust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Adjust meal plan layout
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # Remove the repeated week labels below the week tabs.
          s = re.sub(r'<div class="weektitle"><span>[1-4]週目</span></div>\s*', '', s)

          # Make the shopping-list reset button a little larger.
          marker = '/* larger shopping reset button */'
          if marker not in s:
              css = '''
          /* larger shopping reset button */
          .shop-reset{margin-top:-30px!important;padding:6px 12px!important;font-size:12px!important;min-height:30px}
          '''
              s = s.replace('</style>', css + '\n</style>', 1)

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet; then
            exit 0
          fi
          git add index.html
          git commit -m 'Remove week labels and enlarge reset button'
          git push

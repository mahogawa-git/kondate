name: Adjust meal plan layout

on:
  push:
    paths:
      - 'index.html'
      - '.github/workflows/rename-title.yml'

permissions:
  contents: write

jobs:
  adjust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Adjust meal plan layout
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          def icon_svg(size):
              radius = round(size * 0.22)
              font = round(size * 0.62)
              y = round(size * 0.70)
              return f'''<svg xmlns="http://www.w3.org/2000/svg" width="{size}" height="{size}" viewBox="0 0 {size} {size}">
          <rect width="{size}" height="{size}" rx="{radius}" fill="#f7f6f2"/>
          <text x="{size/2:g}" y="{y}" text-anchor="middle" font-size="{font}">🍳</text>
          </svg>'''

          # Browser/tab favicon.
          Path('favicon.svg').write_text(icon_svg(64), encoding='utf-8')

          # Home-screen/PWA icons.
          Path('icon-192.svg').write_text(icon_svg(192), encoding='utf-8')
          Path('icon-512.svg').write_text(icon_svg(512), encoding='utf-8')

          manifest = {
              "name": "4週間献立",
              "short_name": "献立",
              "start_url": "./",
              "scope": "./",
              "display": "standalone",
              "background_color": "#f7f6f2",
              "theme_color": "#f7f6f2",
              "icons": [
                  {
                      "src": "icon-192.svg",
                      "sizes": "192x192",
                      "type": "image/svg+xml",
                      "purpose": "any maskable"
                  },
                  {
                      "src": "icon-512.svg",
                      "sizes": "512x512",
                      "type": "image/svg+xml",
                      "purpose": "any maskable"
                  }
              ]
          }
          Path('manifest.webmanifest').write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8'
          )

          # Add favicon + home-screen metadata to the page head.
          head_items = [
              '<link rel="icon" href="favicon.svg" type="image/svg+xml"/>',
              '<link rel="manifest" href="manifest.webmanifest"/>',
              '<link rel="apple-touch-icon" href="icon-192.svg"/>',
              '<meta name="theme-color" content="#f7f6f2"/>',
              '<meta name="mobile-web-app-capable" content="yes"/>'
          ]
          anchor = '<title>4週間献立</title>'
          for item in head_items:
              if item not in s:
                  s = s.replace(anchor, anchor + '\n' + item, 1)

          # Remove the repeated week labels below the week tabs.
          s = re.sub(r'<div class="weektitle"><span>[1-4]週目</span></div>\s*', '', s)

          # Show the meals in shopping-cycle order: weekend first, then Mon-Fri.
          day_order = {
              '週末昼': 0,
              '週末夜': 1,
              '月': 2,
              '火': 3,
              '水': 4,
              '木': 5,
              '金': 6,
          }
          card_re = re.compile(r'<section class="daycard">.*?</section>', re.S)
          title_re = re.compile(r'<h3>(.*?)</h3>')
          week_re = re.compile(
              r'(<main class="week"[^>]*>)(.*?)(<section class="prep-summary">)',
              re.S,
          )

          def reorder_week(match):
              body = match.group(2)
              cards = list(card_re.finditer(body))
              if not cards:
                  return match.group(0)

              ordered = []
              for card in cards:
                  title_match = title_re.search(card.group(0))
                  title = title_match.group(1) if title_match else ''
                  ordered.append((day_order.get(title, 99), card.group(0)))
              ordered.sort(key=lambda item: item[0])

              first = cards[0].start()
              last = cards[-1].end()
              body = body[:first] + ''.join(card for _, card in ordered) + body[last:]
              return match.group(1) + body + match.group(3)

          s = week_re.sub(reorder_week, s)

          # Keep the prep legend in the same weekend-first order.
          legend_re = re.compile(r'(<div class="prep-weekday-legend">)(.*?)(</div>)', re.S)
          chip_re = re.compile(r'<span class="prep-day-chip [^"]+">.*?</span>', re.S)

          def reorder_legend(match):
              chips = chip_re.findall(match.group(2))
              if not chips:
                  return match.group(0)

              def chip_order(chip):
                  text = re.sub(r'<[^>]+>', '', chip)
                  return day_order.get(text, 99)

              chips.sort(key=chip_order)
              return match.group(1) + ''.join(chips) + match.group(3)

          s = legend_re.sub(reorder_legend, s)

          # Repair shopping-list fractions that were incorrectly split on the
          # half-width slash. Full-width ／ is the separator between materials.
          pair = re.compile(
              r'(<label class="shop-row"><input[^>]*/><span class="shop-item-text">)'
              r'([^<]*\s\d+(?:\s+\d+)?)'
              r'(</span></label>)'
              r'<label class="shop-row"><input[^>]*/><span class="shop-item-text">'
              r'(\d+[^<]*)'
              r'</span></label>'
          )
          while True:
              s2, n = pair.subn(lambda m: m.group(1) + m.group(2) + '/' + m.group(4) + m.group(3), s)
              s = s2
              if n == 0:
                  break

          # Make the shopping-list reset button a little larger.
          marker = '/* larger shopping reset button */'
          if marker not in s:
              css = '''
          /* larger shopping reset button */
          .shop-reset{margin-top:-30px!important;padding:6px 12px!important;font-size:12px!important;min-height:30px}
          '''
              s = s.replace('</style>', css + '\n</style>', 1)

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            exit 0
          fi
          git add index.html favicon.svg icon-192.svg icon-512.svg manifest.webmanifest
          git commit -m 'Adjust meal plan layout'
          git push

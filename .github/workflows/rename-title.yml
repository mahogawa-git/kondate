name: Adjust meal plan layout

on:
  push:
    paths:
      - 'index.html'
      - '.github/workflows/rename-title.yml'

permissions:
  contents: write

jobs:
  adjust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Adjust meal plan layout
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # Add a bookmark/browser-tab icon that matches the meal-plan title.
          favicon = Path('favicon.svg')
          favicon.write_text('''<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
          <rect width="64" height="64" rx="14" fill="#f7f6f2"/>
          <text x="32" y="45" text-anchor="middle" font-size="40">🍳</text>
          </svg>''', encoding='utf-8')
          icon_link = '<link rel="icon" href="favicon.svg" type="image/svg+xml"/>'
          if icon_link not in s:
              s = s.replace('<title>4週間献立</title>', '<title>4週間献立</title>\n' + icon_link, 1)

          # Remove the repeated week labels below the week tabs.
          s = re.sub(r'<div class="weektitle"><span>[1-4]週目</span></div>\s*', '', s)

          # Repair shopping-list fractions that were incorrectly split on the
          # half-width slash. Example: "白菜 1" + "4玉" -> "白菜 1/4玉".
          # Full-width ／ remains the only intended separator between materials.
          pair = re.compile(
              r'(<label class="shop-row"><input[^>]*/><span class="shop-item-text">)'
              r'([^<]*\s\d+(?:\s+\d+)?)'
              r'(</span></label>)'
              r'<label class="shop-row"><input[^>]*/><span class="shop-item-text">'
              r'(\d+[^<]*)'
              r'</span></label>'
          )
          while True:
              s2, n = pair.subn(lambda m: m.group(1) + m.group(2) + '/' + m.group(4) + m.group(3), s)
              s = s2
              if n == 0:
                  break

          # Make the shopping-list reset button a little larger.
          marker = '/* larger shopping reset button */'
          if marker not in s:
              css = '''
          /* larger shopping reset button */
          .shop-reset{margin-top:-30px!important;padding:6px 12px!important;font-size:12px!important;min-height:30px}
          '''
              s = s.replace('</style>', css + '\n</style>', 1)

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            exit 0
          fi
          git add index.html favicon.svg
          git commit -m 'Add meal plan bookmark icon'
          git push
